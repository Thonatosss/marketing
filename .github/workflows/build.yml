name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Перевірка, що закомічена збірка (assets/) актуальна
        run: |
          git diff --exit-code -- assets || {
            echo "::error::assets/ не відповідає вихідникам. Виконайте 'npm run build' і закомітьте результат."
            exit 1
          }
